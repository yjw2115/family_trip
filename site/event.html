<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 이야기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <a href="index.html">← 홈</a>
  <button id="menuBtn" class="hidden">⋯ 더보기</button>
</div>
<main id="main"><p class="sub">불러오는 중…</p></main>

<input type="file" id="files" accept="image/*" multiple hidden>

<div class="viewer hidden" id="viewer" role="dialog" aria-label="사진 크게 보기">
  <div class="vtop"><button id="vClose">✕ 닫기</button><span id="vCount"></span></div>
  <div class="stage" id="vStage"><img id="vImg" alt=""></div>
  <div class="vbottom">
    <div class="row"><button class="btn" id="vPrev">◀ 이전</button><button class="btn" id="vNext">다음 ▶</button></div>
    <div class="caption" id="vCaption"></div>
    <div class="vmeta" id="vMeta"></div>
    <div class="row">
      <button class="btn" id="vEdit">✏ 메모</button>
      <button class="btn" id="vCover">⭐ 대표로</button>
    </div>
    <div class="row" style="margin-top: 12px"><button class="btn btn-danger" id="vDel">🗑 지우기</button></div>
  </div>
</div>

<script type="module" src="js/event.js"></script>
</body>
</html>
