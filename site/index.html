<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 이야기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>우리 가족 이야기</h1>
  <div class="seg" id="kinds">
    <button data-k="all">전체</button><button data-k="trip">여행</button><button data-k="gathering">가족 모임</button>
  </div>
  <select id="year" aria-label="연도"></select>
  <div id="list"><p class="sub">불러오는 중…</p></div>
  <p style="text-align: center; margin-top: 32px"><a href="trash.html">휴지통</a></p>
</main>

<div class="bottom-bar"><button class="btn btn-primary btn-block" id="newBtn">＋ 새 모임 만들기</button></div>

<dialog id="newDlg">
  <form id="newForm">
    <h2 style="margin-top: 0">새 모임 만들기</h2>
    <label for="nTitle">제목</label>
    <input id="nTitle" type="text" required placeholder="예: 어머니 생신">
    <label>종류</label>
    <div class="radio-row">
      <label><input type="radio" name="kind" value="trip" checked> 여행</label>
      <label><input type="radio" name="kind" value="gathering"> 가족 모임</label>
    </div>
    <label for="nStart">날짜</label>
    <input id="nStart" type="date" required>
    <div id="endWrap">
      <label for="nEnd">끝나는 날 (선택)</label>
      <input id="nEnd" type="date">
    </div>
    <p id="nErr" class="errors hidden"></p>
    <div class="row">
      <button type="button" class="btn btn-outline" id="nCancel">취소</button>
      <button class="btn btn-primary">만들기</button>
    </div>
    <p style="text-align: center; margin-bottom: 0"><a href="paste.html">계획으로 새 여행 만들기</a></p>
  </form>
</dialog>

<script type="module">
import { sb, $, esc, requireLogin, fmtRange, dday, isUpcoming, KIND, photoUrls, fullKey, thumbKey, purge, friendly } from './js/common.js';
await requireLogin();

const params = new URLSearchParams(location.search);
let kind = params.get('kind') || 'all', year = params.get('year') || 'all';

const { data: events, error } = await sb.from('event_list')
  .select('id,kind,title,start_date,end_date,cover_path,photo_count')
  .order('start_date', { ascending: false });
if (error) { $('#list').innerHTML = `<p class="errors">${esc(friendly(error))}</p>`; throw error; }

const years = [...new Set(events.map(e => e.start_date.slice(0, 4)))];
$('#year').innerHTML = `<option value="all">연도: 전체</option>` + years.map(y => `<option value="${y}">${y}년</option>`).join('');
if (!years.includes(year)) year = 'all';
$('#year').value = year;

const upcoming = events.filter(isUpcoming).reverse();
const banner = upcoming[0];
const urls = await photoUrls(events.filter(e => e.cover_path).flatMap(e =>
  e === banner ? [fullKey(e.cover_path)] : [thumbKey(e.cover_path)]));

function card(e, big) {
  const key = e.cover_path && (big ? fullKey : thumbKey)(e.cover_path);
  const d = dday(e);
  return `<a class="card${big ? ' banner' : ''}" href="event.html?id=${e.id}">
    ${key ? `<img class="cover" src="${esc(urls[key])}" alt="" loading="lazy">` : `<div class="noimg">${e.kind === 'trip' ? '✈' : '🎂'}</div>`}
    ${d && big ? `<span class="badge">${d}</span>` : ''}
    <div class="body">
      <div class="kind">${KIND[e.kind]} ${d && !big ? `<span class="badge">${d}</span>` : ''}</div>
      <div class="name">${esc(e.title)}</div>
      <div>${fmtRange(e.start_date, e.end_date)}</div>
    </div></a>`;
}

function render() {
  const ok = e => (kind === 'all' || e.kind === kind) && (year === 'all' || e.start_date.startsWith(year));
  const up = upcoming.filter(ok), past = events.filter(e => !isUpcoming(e) && ok(e));
  for (const b of $('#kinds').children) b.setAttribute('aria-pressed', b.dataset.k === kind);
  const q = new URLSearchParams();
  if (kind !== 'all') q.set('kind', kind);
  if (year !== 'all') q.set('year', year);
  history.replaceState(null, '', q.size ? '?' + q : location.pathname);
  $('#list').innerHTML =
    (up.length ? `<h2>다가오는 모임</h2>` + up.map(e => card(e, e === banner)).join('') : '') +
    `<h2>지난 모임</h2>` +
    (past.length ? past.map(e => card(e, false)).join('') : `<p class="empty">아직 없어요.</p>`);
  if (!events.length) $('#list').innerHTML = `<p class="empty" style="margin-top: 24px">첫 모임을 만들어 보세요.<br>아래 <b>＋ 새 모임 만들기</b>를 누르면 돼요.</p>`;
}
render();

$('#kinds').onclick = e => { if (e.target.dataset.k) { kind = e.target.dataset.k; render(); } };
$('#year').onchange = e => { year = e.target.value; render(); };

// 새 모임
const dlg = $('#newDlg'), form = $('#newForm');
const syncKind = () => $('#endWrap').classList.toggle('hidden', form.kind.value !== 'trip');
form.onchange = syncKind;
$('#newBtn').onclick = () => { form.reset(); syncKind(); $('#nErr').classList.add('hidden'); dlg.showModal(); };
$('#nCancel').onclick = () => dlg.close();
form.onsubmit = async e => {
  e.preventDefault();
  const start = $('#nStart').value, end = form.kind.value === 'trip' ? $('#nEnd').value : '';
  const bad = !$('#nTitle').value.trim() ? '제목을 써 주세요.' : end && end < start ? '끝나는 날이 시작하는 날보다 빨라요.' : '';
  if (bad) { $('#nErr').textContent = bad; return $('#nErr').classList.remove('hidden'); }
  e.submitter.disabled = true;
  const { data, error } = await sb.from('events')
    .insert({ kind: form.kind.value, title: $('#nTitle').value.trim(), start_date: start, end_date: end || null })
    .select('id').single();
  e.submitter.disabled = false;
  if (error) { $('#nErr').textContent = friendly(error); return $('#nErr').classList.remove('hidden'); }
  location.href = 'event.html?id=' + data.id;
};

// 30일 지난 휴지통을 조금씩 정리
purge(new Date(Date.now() - 30 * 864e5).toISOString()).catch(() => {});
</script>
</body>
</html>
