<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계획 붙여넣기 · 우리 가족 이야기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><a id="back" href="index.html">← 홈</a></div>
<main>
  <h1>계획 붙여넣기</h1>
  <p id="intro">Claude가 만들어 준 계획을 아래 칸에 붙여넣어 주세요.</p>
  <textarea id="src" style="min-height: 220px" placeholder='{ "version": 1, ... }' spellcheck="false"></textarea>
  <button class="btn btn-primary btn-block" id="check" style="margin-top: 12px">미리보기</button>
  <div id="out" role="status"></div>
</main>
<script type="module">
import { sb, $, esc, requireLogin, fmtRange, friendly } from './js/common.js';
import { checkPlan, diffChecklist } from './js/plan.js';
await requireLogin();

const id = Number(new URLSearchParams(location.search).get('id')) || null;
let ev = null, oldItems = [], plan = null;

if (id) {
  const [a, b] = await Promise.all([
    sb.from('event_list').select('id,kind,title,start_date,end_date').eq('id', id).maybeSingle(),
    sb.from('checklist_items').select('grp,text,checked').eq('event_id', id),
  ]);
  ev = a.data; oldItems = b.data || [];
  if (!ev || ev.kind !== 'trip') {
    $('main').innerHTML = `<p class="empty">여행을 찾을 수 없어요.<br><a href="index.html">홈으로</a></p>`;
    throw new Error('no trip');
  }
  $('#back').href = 'event.html?id=' + id;
  $('#back').textContent = '← ' + ev.title;
  $('#intro').textContent = `"${ev.title}"의 일정과 준비물을 새 계획으로 바꿔요. 사진·한마디·체크 표시는 그대로예요.`;
} else {
  $('#intro').textContent = 'Claude가 만들어 준 계획을 붙여넣으면 새 여행이 만들어져요.';
}

$('#src').oninput = () => { plan = null; $('#out').innerHTML = ''; };

$('#check').onclick = () => {
  const r = checkPlan($('#src').value);
  if (r.errors) {
    plan = null;
    const shown = r.errors.slice(0, 10);
    $('#out').innerHTML = `<div class="errors"><b>고칠 곳이 있어요</b><ul>${shown.map(e => `<li>⚠ ${esc(e)}</li>`).join('')}</ul>
      ${r.errors.length > 10 ? `<p>그 밖에 ${r.errors.length - 10}곳 더 있어요.</p>` : ''}
      <p class="sub">Claude에게 이 내용을 그대로 보여주고 고쳐 달라고 하면 돼요.</p></div>`;
    return;
  }
  plan = r.plan;
  const t = plan.trip, changes = [];
  if (ev) {
    if (ev.title !== t.title) changes.push(`제목: ${ev.title} → ${t.title}`);
    if (ev.start_date !== t.startDate || (ev.end_date || '') !== t.endDate) changes.push(`날짜: ${fmtRange(ev.start_date, ev.end_date)} → ${fmtRange(t.startDate, t.endDate)}`);
    changes.push('일정이 새 계획으로 바뀌어요');
    const d = diffChecklist(oldItems, plan.checklist);
    changes.push(`준비물 ${d.added}개 추가, ${d.removed}개 빠짐`);
    changes.push(`체크 표시 ${d.keptChecked}개는 그대로`);
    changes.push('사진·한마디는 그대로');
  }
  $('#out').innerHTML = `<div class="preview">
      <b style="font-size: 1.25rem">${esc(t.title)}</b>
      <div>${fmtRange(t.startDate, t.endDate)}${t.people ? ` · ${t.people}명` : ''}</div>
      ${t.destination || t.stay ? `<div class="sub">${esc([t.destination, t.stay && '숙소: ' + t.stay].filter(Boolean).join(' · '))}</div>` : ''}
      <div style="margin-top: 8px">일정 ${plan.days.length}일 · 준비물 ${plan.checklist.length}개</div>
      ${changes.length ? `<p style="margin: 12px 0 4px"><b>바뀌는 점</b></p><ul>${changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    </div>
    <button class="btn btn-primary btn-block" id="save">${ev ? '저장하기' : '새 여행 만들기'}</button>`;
  $('#save').onclick = async e => {
    e.target.disabled = true;
    e.target.textContent = '저장하는 중…';
    const { data, error } = await sb.rpc('save_plan', { p_event_id: id, p_plan: plan });
    if (error) {
      e.target.disabled = false;
      e.target.textContent = '다시 저장하기';
      $('#out').insertAdjacentHTML('afterbegin', `<p class="errors">${esc(friendly(error))}</p>`);
      return;
    }
    location.href = `event.html?id=${data}#schedule`;
  };
};
</script>
</body>
</html>
